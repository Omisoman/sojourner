[project]
name = "sojourner"
version = "0.1.0"
description = "Two-tier governed developer harness — an OpenCode sandbox and an A2A ops agent — that develops, gates and deploys new-horizons"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Omar Soman" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # the farm app and the shared harness (audit chain, access rules, JSON tool
    # protocol, LangGraph graph, LLM provider) — tier-2 imports
    # new_horizons.shared.*, tier-1 develops a checkout of it
    "new-horizons @ git+https://github.com/omarsoman/new-horizons",
    # tier-2 A2A server
    "a2a-sdk[http-server]>=1.1",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "pyyaml>=6",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/omarsoman/sojourner"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "import-linter>=2.1"]

# Local development resolves the sibling checkout (editable); CI and a clean
# clone without the sibling use `uv sync --no-sources` and the git URL above.
[tool.uv.sources]
new-horizons = { path = "../new-horizons", editable = true }

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: needs a running Ollama model (skipped in CI)",
    "stack: needs the tier stack up (make demo2-up)",
]
